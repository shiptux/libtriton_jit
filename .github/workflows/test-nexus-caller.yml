# Temporary test harness: validates the reusable upload workflow on
# shiptux forks before the real org rollout. Delete after testing.

name: Test Nexus caller

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build workflow run ID (optional)'
        required: false

jobs:
  upload:
    uses: shiptux/build-infra/.github/workflows/upload-nexus.yml@ci/upload-nexus
    with:
      run_id: ${{ github.event.inputs.run_id }}
    secrets: inherit
